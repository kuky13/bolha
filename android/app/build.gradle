// SPDX-License-Identifier: GPL-3.0-or-later
plugins {
    id 'com.android.application' version '8.10.1'
    id 'com.chaquo.python' version '17.2.0'
}
def projectRoot = rootProject.projectDir.parentFile
def sharedVersion = (new File(projectRoot, 'pyproject.toml').text =~ /(?m)^version = "([^"]+)"/)[0][1]
if (!(sharedVersion ==~ /[0-9]{1,6}(\.[0-9]{1,6}){2,3}/)) {
    throw new GradleException('Versão da Bolha inválida.')
}
def parts = sharedVersion.tokenize('.').collect { it.toInteger() }
if (parts.size() == 3) parts.add(0)
def (major, minor, patch, revision) = parts
if (major > 20 || minor > 99 || patch > 999 || revision > 999) {
    throw new GradleException('Versão fora dos limites do código de versão Android.')
}
// Dá espaço à revisão e mantém a atualização acima dos APKs 0.5.x já publicados.
def androidVersionCode = major * 100_000_000 + minor * 1_000_000 + patch * 1_000 + revision
def projectKeystore = System.getenv('BOLHA_ANDROID_KEYSTORE')
android {
    namespace 'solutions.kuky.bolha.mobile'
    buildFeatures { buildConfig true }
    compileSdk 35
    defaultConfig {
        applicationId 'solutions.kuky.bolha.mobile'
        minSdk 24
        targetSdk 35
        versionCode androidVersionCode
        versionName sharedVersion
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    signingConfigs {
        if (projectKeystore) {
            projectKey {
                storeFile file(projectKeystore)
                storePassword System.getenv('BOLHA_ANDROID_KEYSTORE_PASSWORD')
                keyAlias 'bolha'
                keyPassword System.getenv('BOLHA_ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            if (projectKeystore) signingConfig signingConfigs.projectKey
        }
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/bolha-assets')
}
def sharedPython = tasks.register('sharedPython', Sync) {
    into layout.buildDirectory.dir('generated/bolha-python')
    from(new File(projectRoot, 'bolha')) {
        include '*.py'
        into 'bolha'
    }
}
chaquopy {
    defaultConfig {
        version '3.13'
        pip {
            options '--extra-index-url', 'https://chaquo.com/pypi-upstream/'
            install 'numpy==2.3.2'
        }
    }
    sourceSets.main.srcDir new File(projectRoot, 'brain')
    sourceSets.main.srcDir sharedPython.map { it.destinationDir }
    sourceSets.main.exclude '**/tests/**', '**/__pycache__/**'
}
def sharedAssets = tasks.register('sharedAssets', Sync) {
    into layout.buildDirectory.dir('generated/bolha-assets')
    from(new File(projectRoot, 'assets/bolha/content')) { into 'content' }
    from(projectRoot) { include 'LICENSE', 'NOTICE.md' }
    from(new File(projectRoot, 'licenses/BOLHA-ASSETS.md')) { into 'licenses' }
    from(new File(rootProject.projectDir, 'licenses')) { into 'licenses/android' }
}
tasks.named('preBuild').configure { dependsOn sharedAssets, sharedPython }
// Chaquopy resolves source paths without carrying the producer task dependency.
tasks.matching { it.name.startsWith('merge') && it.name.endsWith('PythonSources') }.configureEach {
    dependsOn sharedPython
}
