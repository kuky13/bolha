name: Android · compilar e validar
on:
  workflow_dispatch:
  push:
    branches: [fix/visual-dialogue-044]
    paths: [.github/workflows/android.yml]
permissions:
  contents: read
concurrency:
  group: bolha-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar Gradle e SDK
        run: |
          set -euo pipefail
          gradle_zip="$RUNNER_TEMP/gradle-8.14.3-bin.zip"
          curl -fsSL --retry 3 https://services.gradle.org/distributions/gradle-8.14.3-bin.zip -o "$gradle_zip"
          echo "bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531  $gradle_zip" | sha256sum --check
          unzip -q "$gradle_zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.14.3/bin" >> "$GITHUB_PATH"
          if [[ ! -d "$ANDROID_HOME/platforms/android-35" || ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]]; then
            sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Compilar, testar cadência de vibração e verificar APK
        run: |
          set -euo pipefail
          javac -d "$RUNNER_TEMP/haptics" android/app/src/main/java/solutions/kuky/bolha/mobile/HapticCadence.java android/tests/HapticCadenceTest.java
          java -cp "$RUNNER_TEMP/haptics" solutions.kuky.bolha.mobile.HapticCadenceTest
          gradle -p android :app:assembleDebug --console=plain --no-daemon
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" > "$RUNNER_TEMP/bolha-apk.txt"
          grep -q "package: name='solutions.kuky.bolha.mobile'" "$RUNNER_TEMP/bolha-apk.txt"
          grep -q "^native-code: .*'arm64-v8a'.*'x86_64'" "$RUNNER_TEMP/bolha-apk.txt"
      - name: Habilitar aceleração do emulador descartável
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-bolha-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Exercitar interface, sobreposição e preferências no Android 15
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python android/tests/smoke.py android/app/build/outputs/apk/debug/app-debug.apk validation/android
      - name: Preparar o APK validado e seu checksum
        run: |
          set -euo pipefail
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          apk="Bolha-${version}-Android.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "validation/android/$apk"
          (cd validation/android && sha256sum "$apk" > ANDROID-SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bolha-android-${{ github.sha }}
          retention-days: 7
          path: validation/android/
