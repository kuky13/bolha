name: Windows · validar e publicar
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: brain/requirements.txt
      - name: Instalar dependências
        run: |
          npm ci --no-audit --no-fund
          python -m pip install -r brain/requirements.txt pytest==8.4.2 pyinstaller==6.22.3
      - name: Conferir tipos e testes
        run: |
          npm run typecheck
          npm test
          python -m pytest brain/tests -q
      - name: Compilar e auditar interface independente
        run: |
          npm run build
          npm run audit:standalone
      - name: Empacotar cérebro e instalador
        run: |
          python scripts/build-brain.py
          npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Abrir aplicativo Windows com cérebro empacotado
        shell: pwsh
        run: |
          $env:BOLHA_SMOKE_EXE = Join-Path $PWD 'release/win-unpacked/Bolha.exe'
          node scripts/smoke.mjs
      - name: Medir consumo da árvore completa e do cérebro
        shell: pwsh
        run: |
          $env:BOLHA_SMOKE_EXE = Join-Path $PWD 'release/win-unpacked/Bolha.exe'
          node scripts/benchmark.mjs
      - name: Gerar versão seguinte para testar atualização
        shell: pwsh
        run: |
          $parts = (Get-Content package.json | ConvertFrom-Json).version.Split('.')
          $nextVersion = $parts[0] + '.' + $parts[1] + '.' + ([int]$parts[2] + 1)
          npx electron-builder --win --publish never --config.directories.output=validation/update-feed --config.extraMetadata.version=$nextVersion
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Validar atualização da 0.1.0 para a correção UTF-8
        timeout-minutes: 9
        shell: pwsh
        run: |
          $previousDir = Join-Path $PWD 'validation/previous'
          New-Item -ItemType Directory -Force $previousDir | Out-Null
          $previousInstaller = Join-Path $previousDir 'Bolha-Setup-0.1.0-x64.exe'
          Invoke-WebRequest 'https://github.com/kuky13/bolha/releases/download/v0.1.0/Bolha-Setup-0.1.0-x64.exe' -OutFile $previousInstaller
          $expected = 'f7cbd370555ed81d9bcc3fb949c1a7091e61433299c65c0958ca97cf09dc8599'
          if ((Get-FileHash $previousInstaller -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Checksum da versão anterior inválido.' }
          $env:BOLHA_UPDATE_TEST_BASE = $previousInstaller
          $env:BOLHA_UPDATE_TEST_FEED = Join-Path $PWD 'release'
          node scripts/test-windows-update.mjs
      - name: Testar instalação e atualização automática reais
        timeout-minutes: 9
        run: node scripts/test-windows-update.mjs
      - name: Gerar checksums
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe,release/*.blockmap,release/latest.yml | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bolha-windows-validation
          path: |
            validation/*.png
            validation/*.json
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
      - name: Conferir tag da versão
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $expected = 'v' + (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne $expected) { throw "A tag deve ser $expected" }
      - name: Publicar instalador validado
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME release/*.exe release/*.blockmap release/latest.yml release/SHA256SUMS.txt --title "Bolha $env:GITHUB_REF_NAME" --notes-file docs/RELEASE.md
