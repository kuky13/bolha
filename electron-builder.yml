appId: solutions.kuky.bolha
productName: Bolha
artifactName: Bolha-Setup-${version}-${arch}.${ext}
copyright: Copyright © 2026 André Ribeiro Lima
directories:
  output: release
files:
  - out/**/*
  - package.json
extraResources:
  - from: brain-dist/BolhaBrain
    to: brain
  - from: assets/drippy/content
    to: brain/content
  - from: assets/drippy/tray.png
    to: tray.png
  - from: LICENSE
    to: licenses/GPL-3.0.txt
  - from: licenses/DRIPPY-ASSETS.md
    to: licenses/DRIPPY-ASSETS.md
  - from: licenses/CC-BY-NC-4.0.txt
    to: licenses/CC-BY-NC-4.0.txt
  - from: brain/LICENSE-UPSTREAM
    to: licenses/PESTINHA-GPL.txt
win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/drippy/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: kuky13
  repo: bolha
  releaseType: release
